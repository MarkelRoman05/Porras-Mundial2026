<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Mundial Porras 2026</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e5b800'%3E%3Cpath d='M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script>let _v;fetch('/api/version').then(r=>r.json()).then(d=>{_v=d.version}).catch(()=>{});setInterval(()=>fetch('/api/version?'+Date.now()).then(r=>r.json()).then(d=>{if(_v&&_v!==d.version)location.href=location.href.split('?')[0]+'?_='+d.version+(location.hash||'')}).catch(()=>{}),2000);fetch('/api/auth/me',{credentials:'same-origin'}).then(r=>{if(r.ok)location.replace('/dashboard.html')}).catch(()=>{})</script>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-logo">
      <span class="trophy"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg></span>
      <h1>MUNDIAL <span>PORRAS</span></h1>
      <p>Crear cuenta nueva</p>
    </div>

    <div id="error" class="error-msg"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="Elige un nombre de usuario" required minlength="3" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 4 caracteres" required minlength="4" autocomplete="new-password">
      </div>

      <div class="form-group">
        <label for="inviteCode">¿Tienes código de grupo? (opcional)</label>
        <input type="text" id="inviteCode" name="inviteCode" placeholder="Ej: ABC12345" autocomplete="off">
      </div>
      <div class="form-group" id="groupNameGroup">
        <label for="groupName">O crea un grupo nuevo</label>
        <input type="text" id="groupName" name="groupName" placeholder="Nombre de tu grupo">
      </div>

      <button type="submit" class="btn btn-primary">Crear cuenta</button>
    </form>

    <div class="auth-footer">
      ¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a>
    </div>
  </div>

  <script>
    const inviteInput = document.getElementById('inviteCode');
    const groupNameGroup = document.getElementById('groupNameGroup');

    const params = new URLSearchParams(window.location.search);
    const inviteParam = params.get('invite');
    if (inviteParam) {
      inviteInput.value = inviteParam;
      groupNameGroup.style.display = 'none';
    }

    inviteInput.addEventListener('input', () => {
      if (inviteInput.value.trim()) {
        groupNameGroup.style.display = 'none';
      } else {
        groupNameGroup.style.display = 'block';
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const inviteCode = document.getElementById('inviteCode').value.trim().toUpperCase();
      let groupName = document.getElementById('groupName').value.trim();

      if (!inviteCode && !groupName) {
        groupName = `Grupo de ${username}`;
      }

      if (inviteCode) groupName = undefined;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, groupName, inviteCode })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
